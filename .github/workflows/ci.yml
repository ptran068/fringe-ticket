name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # GitHub-hosted runners have Docker. Local machines can keep using
      # hosted Supabase via .env.local; CI always uses this ephemeral stack.
      - run: supabase start
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

      - name: Point verify at the local stack
        run: |
          eval "$(supabase status -o env)"
          URL="${API_URL:-}"
          ANON="${ANON_KEY:-}"
          SERVICE="${SERVICE_ROLE_KEY:-}"
          if [ -z "$URL" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "supabase status -o env did not set API_URL / ANON_KEY / SERVICE_ROLE_KEY"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE}"
          } | tee .env.local >> "$GITHUB_ENV"

      - run: npm run verify
